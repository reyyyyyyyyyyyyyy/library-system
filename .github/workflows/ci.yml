name: LMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build (check syntax)
        run: python -m compileall -q library.py demo.py tests

      - name: Run tests with coverage
        run: python -m pytest -v --cov=library

      - name: Run demo
        run: python demo.py
